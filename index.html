<!DOCTYPE html>
<html>
    <head>
        <title>Grab N Crave</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="text-center">
                        <img src="logo.png" class="img-fluid">
                    </div>
                </div>
            </div>
        
            <div class="row">
                <div class="col-12">
                    <div class="text-center">
                        <h1>Our Menu</h1>
                    </div>
                    <div class="alert alert-info" role="alert">
                        Our restaurant will be closed on New Year's Eve
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12 col-lg-6">
                    <h2>Chicken Pasta<span class="badge bg-secondary">NEW</span></h2>
                    <p>Pasta, Chicken, Cheese.</p>
                    <h2>Fried Rice</h2>
                    <p>Rice, Beans, Eggs.</p>
                </div>
                <div class="col-12 col-lg-6">
                    <h2>Onion Chicken</h2>
                    <p>Chicken, Onion, Garlic.</p>
                    <h2>Beef Sizzling</h2>
                    <p>Beef, Bell Peeper, Soy Sauce.</p>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="text-center">
                        <button type="button" class="btn btn-primary">Order Online</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
