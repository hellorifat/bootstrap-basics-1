<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Grab N Crave</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-icons.min.css" rel="stylesheet">
        <style>
            :root {
                --brand-primary: #d9534f;
                --brand-dark: #212529;

            }

            .navbar-brand{
                font-weight: 700;
                letter-spacing: 0.5;
            }

            .menu-card{
                border: 1px solid rgba(0,0,0,0.08);
                border-radius: 10px;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }

            .menu-card:hover{
                transform: translateY(-4px);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            }

            .menu-card img{
                height: 200px;
                object-fit: cover;
                border-top-left-radius: 9px;
                border-top-right-radius: 9px;

            }

            .price-tag {
                font-weight: 600;
                font-size: 1.1rem;
            }
        </style>


    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="text-center">
                        <img src="logo.png" class="img-fluid">
                    </div>
                </div>
            </div>
        
            <div class="row">
                <div class="col-12">
                    <div class="text-center">
                        <h1>Our Menu</h1>
                    </div>
                    <div class="alert alert-info" role="alert">
                        Our restaurant will be closed on New Year's Eve
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12 col-lg-6">
                    <h2>Chicken Pasta<span class="badge bg-secondary">NEW</span></h2>
                    <p>Pasta, Chicken, Cheese.</p>
                    <h2>Fried Rice</h2>
                    <p>Rice, Beans, Eggs.</p>
                </div>
                <div class="col-12 col-lg-6">
                    <h2>Onion Chicken</h2>
                    <p>Chicken, Onion, Garlic.</p>
                    <h2>Beef Sizzling</h2>
                    <p>Beef, Bell Peeper, Soy Sauce.</p>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="text-center">
                        <button type="button" class="btn btn-primary">Order Online</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
